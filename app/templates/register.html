{% extends "base.html" %}

{% block title %}Register - ATS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 px-8">
    <div class="bg-white border border-gray-200 rounded-2xl p-10 shadow-lg">
        <h2 class="text-3xl mb-2 text-center font-bold">Create Account</h2>
        <p class="text-gray-600 text-center mb-8">Join to start managing attendance</p>
        <form id="registerForm">
            <div class="mb-5">
                <label for="regName" class="block mb-2 text-gray-600 font-semibold">Full Name</label>
                <input type="text" id="regName" name="username"
                    class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
                    required minlength="2">
            </div>
            <div class="mb-5">
                <label for="regEmail" class="block mb-2 text-gray-600 font-semibold">Email</label>
                <input type="email" id="regEmail" name="userEmail"
                    class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
                    required>
            </div>
            <div class="mb-5">
                <label for="regPassword" class="block mb-2 text-gray-600 font-semibold">Password</label>
                <input type="password" id="regPassword" name="password"
                    class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
                    required minlength="6">
            </div>
            <div class="mb-5">
                <label for="regConfirmPassword" class="block mb-2 text-gray-600 font-semibold">Confirm Password</label>
                <input type="password" id="regConfirmPassword" name="confirm_password"
                    class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
                    required>
            </div>
            <button type="submit" id="registerBtn"
                class="w-full py-3.5 bg-blue-500 text-white rounded-lg font-semibold transition-all hover:bg-blue-700">Create
                Account</button>
        </form>
        <div id="registerMessage" class="mt-4 text-center hidden"></div>
        <div class="mt-6 text-center text-gray-600">
            Already have an account? <a href="{{ url_for('auth_bp.login') }}" class="text-blue-500 font-semibold">Login
                here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const formData = new FormData(this);
        const username = formData.get('username').trim();
        const userEmail = formData.get('userEmail').trim();
        const password = formData.get('password');
        const confirmPassword = formData.get('confirm_password');

        if (!username || username.length < 2) {
            showMessage('Full name must be at least 2 characters long.', 'error');
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(userEmail)) {
            showMessage('Please enter a valid email address.', 'error');
            return;
        }

        if (!password || password.length < 6) {
            showMessage('Password must be at least 6 characters long.', 'error');
            return;
        }

        if (password !== confirmPassword) {
            showMessage('Passwords do not match.', 'error');
            return;
        }

        const btn = document.getElementById('registerBtn');
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Creating Account...';

        try {
            const response = await fetch('{{ url_for("auth_bp.register") }}', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                showMessage(data.message || 'Registration successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '{{ url_for("auth_bp.login") }}';
                }, 1500);
            } else {
                showMessage(data.message || 'Registration failed. Please try again.', 'error');
            }
        } catch (error) {
            showMessage('Network error. Please check your connection and try again.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = originalText;
        }
    });

    function showMessage(message, type) {
        const messageEl = document.getElementById('registerMessage');
        messageEl.textContent = message;
        messageEl.className = `mt-4 text-center ${type === 'success' ? 'text-green-600' : 'text-red-600'}`;
        messageEl.classList.remove('hidden');
        setTimeout(() => {
            messageEl.classList.add('hidden');
        }, 5000);
    }
</script>
{% endblock %}
